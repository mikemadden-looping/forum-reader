name: ForumReader
options:
  bundleIdPrefix: com.mikemadden
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    VERSIONING_SYSTEM: apple-generic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ForumReader:
    type: application
    platform: iOS
    sources:
      - path: ForumReader
        excludes:
          - Resources/reader.js
      - path: ForumReader/Resources/reader.js
        buildPhase: resources
    scheme: {}
    info:
      path: ForumReader/Info.plist
      properties:
        CFBundleDisplayName: Forums
        CFBundleName: Forums
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemadden.ForumReader
        PRODUCT_NAME: ForumReader
        INFOPLIST_KEY_CFBundleDisplayName: Forums
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
